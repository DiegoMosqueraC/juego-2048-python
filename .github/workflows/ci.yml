# Integración continua del juego 2048.
# Cada push o pull request ejecuta el análisis estático, el análisis de seguridad
# y todas las pruebas automatizadas. Si un paso falla, el pipeline se detiene y
# GitHub marca el commit en rojo para que el cambio no llegue a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad-y-pruebas:
    name: Python ${{ matrix.python-version }} en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux usa curses real; Windows comprueba el modo de texto sin curses.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # El proyecto no tiene requirements.txt: la caché se calcula con este archivo.
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt

      - name: Análisis estático (flake8, PEP 8 y complejidad ciclomática)
        run: flake8 .

      - name: Análisis de seguridad (bandit)
        run: bandit -r . -x ./tests,./docs

      - name: Pruebas automatizadas y cobertura (pytest)
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Pruebas de la interfaz web (node:test)
        run: node --test "tests/js/*.test.js"

      - name: Publicar el reporte de cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: reporte-cobertura
          path: coverage.xml

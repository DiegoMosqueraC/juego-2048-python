# Configuración centralizada de las herramientas de calidad del proyecto.

[flake8]
# Longitud de línea acordada en la guía de la asignatura (PEP 8 / Black).
max-line-length = 88
# Complejidad ciclomática máxima permitida por función (McCabe).
max-complexity = 10
exclude = .git,__pycache__,.venv,venv,htmlcov,.pytest_cache

[tool:pytest]
testpaths = tests
pythonpath = .
addopts = -ra

[coverage:run]
branch = True
source = .
omit =
    tests/*
    .venv/*
    venv/*

[coverage:report]
show_missing = True
skip_covered = False
